server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8 # 한글 인코딩
      enabled: true # 인코딩 활성화
      force: true  # 요청/응답 모두 UTF-8 강제 적용 (한글 깨짐 방지)

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/board_rest_api?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: developer
    password: dev1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update # 테이블 없으면 생성, 있으면 수정
    #    defer-datasource-initialization: true  # ✅ Hibernate가 테이블 만든 후 data.sql 실행
    show-sql: true
    properties:
      hibernate.format_sql: true
      use_sql_comments: true
      dialect: org.hibernate.dialect.MySQLDialect
sql:
init:
mode: always        # 🚀 data.sql 실행 활성화
encoding: UTF-8